version: '3.8'

services:
  # ─── PostgreSQL Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: workshop_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - workshop_pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workshop-prod-net

  # ─── pgAdmin 4 ──────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: workshop_pgadmin_prod
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    # No exposed ports here! Coolify's Traefik reverse proxy will handle routing
    # traffic to pgAdmin securely via a custom subdomain (e.g., pgadmin.yourdomain.com).
    volumes:
      - workshop_pgadmin_data_prod:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workshop-prod-net

  # ─── Next.js App ────────────────────────────────────────────────
  nextjs:
    # If pushing to Docker Hub, replace `build:` with `image: yourusername/workshop-app:latest`
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workshop_app_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workshop-prod-net

volumes:
  workshop_pg_data_prod:
  workshop_pgadmin_data_prod:

networks:
  workshop-prod-net:
    driver: bridge
